services:
  frontend:
    image: bedeneche/builders:v1.0.0
    ports:
      - "8008:3000"

  backend:
    image: boundless-backend:latest
    ports:
      - "2005:8000"
    env_file:
      - .env.local
    environment:
      MONGODB_URI: mongodb://db:27017/boundless
    depends_on:
      - db

  db:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: